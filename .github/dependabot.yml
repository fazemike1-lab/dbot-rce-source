version: 2
registries:
  internal-host-canary:
    type: git
    url: https://host.docker.internal
    username: dependabot-canary
    password: ${{secrets.DBOT_INTERNAL_CANARY}}
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    registries:
      - internal-host-canary
    groups:
      hosted-internal-boundary-probe:
        patterns:
          - "*"
