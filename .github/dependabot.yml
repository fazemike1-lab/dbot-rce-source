version: 2
registries:
  azure-wire-canary:
    type: git
    url: https://168.63.129.16
    username: dependabot-canary
    password: ${{secrets.DBOT_INTERNAL_CANARY}}
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    registries:
      - azure-wire-canary
    groups:
      hosted-wire-config-read-probe:
        patterns:
          - "*"
